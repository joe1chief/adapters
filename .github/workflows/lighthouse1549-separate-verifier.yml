name: Lighthouse 1549 separate verifier
on:
  push:
    branches: [diagnostic/lighthouse1549-separate-verifier-20261121]
    paths: [.github/workflows/lighthouse1549-separate-verifier.yml]
permissions:
  contents: read
concurrency:
  group: lighthouse1549-separate-verifier-once-20261121
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact adapter commit
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          repository: joe1chief/adapters
          ref: 5c128513eba0f3fc720f1b6f172c009f51a3295d
          path: adapter-source
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Check out exact Harbor v0.27.0 commit
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          repository: harbor-framework/harbor
          ref: 96c86af3bc6d7e92f21fc771d21273be4714c8e9
          path: harbor-source
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Lighthouse 1549 exact-adapter oracle and no-op
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE:?}"
          export LIGHTHOUSE_PRIVATE_DIR="$(mktemp -d "${RUNNER_TEMP:?}/lighthouse1549.XXXXXXXX")"
