name: Lighthouse 1549 separate verifier
on:
  push:
    branches: [diagnostic/lighthouse1549-separate-verifier-20261121]
    paths: [.github/workflows/lighthouse1549-separate-verifier.yml]
permissions:
  contents: read
concurrency:
  group: lighthouse1549-separate-verifier-once-20261121
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Lighthouse 1549 exact-adapter oracle and no-op
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,tomllib,platform,shutil,subprocess,time,urllib.request
          P=pathlib.Path
          start=time.monotonic();private=P('private-run-data');private.mkdir()
          adapter='5c128513eba0f3fc720f1b6f172c009f51a3295d';harbor='96c86af3bc6d7e92f21fc771d21273be4714c8e9';source='8d3ed32f37af9ceb8b5778b92a0088384ed057d4'
          cases=[{'id': '1549', 'image': 'swebench/sweb.eval.x86_64.googlechrome_1776_lighthouse-1549@sha256:3612d5a8a0a4c78f24fa22b672619f18565cac40cdc4fdb0e50dfdb5e7ce5347', 'inputs': {'Dockerfile': '96565377ae322cf68419ebb17e813e08e49bfaacd1bb09bdb20780909df675ff', 'eval.sh': 'e0e6b83ededb55e546a4e17b0904b9a7da47bdc13c89fc6895519e9bb3b5632f', 'gold.patch': '5df9b0e82561b0080c5981ad8c0d13bf7392467e27a00671a97bd10a44a4f305', 'problem_assets/0-27e874c6-8f15-11e6-9e6c-1a9407a64d14.png': '08ce0dd8939e619fe96360eb6a8adc368acbd70217096ddf5e97df16b738a0c7', 'problem_statement.md': 'f1c3dc4f250cff4fe725b09b08bf5c222c8e7652e5c6a5132c68007d7fec9281', 'task.yaml': '78645fb50a598cf61a751aa7f4af010adc4c0fb9199e7222472676d4fb0df057', 'test.patch': '4c92b5224bc9c3abfb258022ee4bb00e394d9ab5b51d27772942a820ed1eb8a5', 'tests.json': '7b8155f54c12e091a3e97d841b25308b6fdb5b7fc4ca398c2954622ff0a742da'}}]
          summary={'adapter_commit':adapter,'harbor_commit':harbor,'task_source_commit':source,'model_calls':0,'scope':'Lighthouse 1549 original oracle/nop only, not full480 or model parity','attempts':[]}
          stage='setup'
          def execute(argv,timeout=120,cwd=None):
              with (private/'setup.log').open('ab') as f:p=subprocess.run(argv,cwd=cwd,stdout=f,stderr=subprocess.STDOUT,timeout=timeout)
              if p.returncode:raise RuntimeError('command_nonzero')
          def checkout(repo,commit,dest):
              execute(['git','init','-q',dest]);execute(['git','-C',dest,'fetch','--depth','1',repo,commit],180);execute(['git','-C',dest,'checkout','--detach','FETCH_HEAD'])
              assert subprocess.check_output(['git','-C',dest,'rev-parse','HEAD'],text=True).strip()==commit
          def error_category(info):
              text=json.dumps(info).lower()
              if any(x in text for x in ['pull access denied','failed to resolve source metadata','failed to resolve reference']):return 'image_resolution'
              if 'no space left on device' in text:return 'disk_exhausted'
              if 'timed out' in text or 'timeout' in text:return 'timeout'
              if 'docker compose' in text and 'build' in text:return 'compose_build'
              if 'docker compose' in text and 'up' in text:return 'compose_start'
              return 'unclassified_infrastructure'
          def sha(p):return hashlib.sha256(P(p).read_bytes()).hexdigest()
          def ids(kind):
              cmd=['docker','ps','-aq'] if kind=='containers' else ['docker','image','ls','-q','--no-trunc']
              return set(subprocess.check_output(cmd,text=True).split())
          def cleanup_containers(before):
              for cid in ids('containers')-before:subprocess.run(['docker','rm','-f',cid],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=20)
          setup_ok=False
          try:
              assert platform.machine()=='x86_64' and shutil.disk_usage('.').free>9*1024**3
              execute(['docker','compose','version'])
              stage='checkout';checkout('https://github.com/joe1chief/adapters.git',adapter,'adapter-source');checkout('https://github.com/harbor-framework/harbor.git',harbor,'harbor-source')
              stage='locked_dependencies';execute(['python3','-m','venv','bootstrap']);execute(['bootstrap/bin/pip','install','uv==0.13.9'],120)
              execute([str(P('bootstrap/bin/uv').resolve()),'sync','--frozen','--no-dev','--python','3.12'],420,'harbor-source')
              py=str(P('harbor-source/.venv/bin/python').resolve());cli=str(P('harbor-source/.venv/bin/harbor').resolve());summary['harbor_lock_sha256']=sha('harbor-source/uv.lock');assert summary['harbor_lock_sha256']=='d411f1b7d259023d8ec2f920d7b8faedcf3b895e2320c2c0b5a606f3e1c2b960';assert subprocess.check_output(['git','hash-object','uv.lock'],cwd='harbor-source',text=True).strip()=='372259f90db33a133db683070411c914aad0057b';setup_ok=True
          except Exception as exc:summary['setup_error']={'stage':stage,'error_type':type(exc).__name__}
          for case in cases:
              n=case['id'];image=case['image'];case_ok=False;before_images=ids('images') if setup_ok else set()
              case_summary={'task':n,'image':image,'source_sha256':case['inputs']};summary.setdefault('cases',[]).append(case_summary)
              try:
                  if not setup_ok:raise RuntimeError('setup_incomplete')
                  if time.monotonic()-start>23*60:raise TimeoutError('budget')
                  if shutil.disk_usage('.').free<7*1024**3:raise OSError('insufficient_disk')
                  stage='public_inputs';td=P('task-source')/('GoogleChrome__lighthouse-'+n);td.mkdir(parents=True)
                  for name,digest in case['inputs'].items():
                      dest=td/name;dest.parent.mkdir(parents=True,exist_ok=True)
                      url='https://raw.githubusercontent.com/SWE-bench/swe-bench-multimodal-tasks/'+source+'/tasks/GoogleChrome__lighthouse-'+n+'/'+name
                      with urllib.request.urlopen(url,timeout=40) as r:dest.write_bytes(r.read())
                      assert sha(dest)==digest
                  meta=td/'task.yaml';text=meta.read_text();old='image: swebench/sweb.eval.x86_64.googlechrome_1776_lighthouse-'+n+':latest';assert text.count(old)==1;meta.write_text(text.replace(old,'image: '+image))
                  stage='generate_exact_adapter';env=dict(os.environ);env['PYTHONPATH']=str(P('adapter-source/src/swebench-multimodal/src').resolve())
                  with (private/(n+'-generation.log')).open('wb') as f:subprocess.run([py,'-m','swebench_multimodal.main','--source-dir','task-source','--output-dir','generated','--task-ids','GoogleChrome__lighthouse-'+n],env=env,stdout=f,stderr=f,check=True,timeout=60)
                  task=P('generated/googlechrome-lighthouse-'+n).resolve();assert task.is_dir()
                  for generated,original in [('tests/eval.sh','eval.sh'),('solution/gold.patch','gold.patch'),('tests/test.patch','test.patch'),('tests/tests.json','tests.json')]:assert sha(task/generated)==case['inputs'][original]
                  for public_asset in (f for f in case['inputs'] if f.startswith('problem_assets/')):
                      assert sha(task/public_asset)==sha(task/'environment'/public_asset)==case['inputs'][public_asset]
                  task_config=tomllib.loads((task/'task.toml').read_text())
                  assert task_config['verifier']['environment_mode']=='separate' and task_config['verifier']['network_mode']=='no-network'
                  assert task_config['artifacts']==['/tmp/harbor-submission/model.patch']
                  case_summary['task_toml_sha256']=sha(task/'task.toml')
                  stage='pull_fixed_image';execute(['docker','pull','--platform','linux/amd64',image],150)
                  detail=json.loads(subprocess.check_output(['docker','image','inspect',image],text=True))[0];assert detail['Architecture']=='amd64' and detail['Os']=='linux' and detail['Id']=='sha256:164971a1f1e387e2fa30a450428e5667a19864e9035572b109a359a343073b69';case_summary['image_id']=detail['Id']
                  case_ok=True
              except Exception as exc:case_summary.update(status='case_preflight_blocked',stage=stage,error_type=type(exc).__name__)
              for agent in ['oracle','nop']:
                  attempt={'task':n,'agent':agent,'fresh_harbor_execution':False};summary['attempts'].append(attempt)
                  if not case_ok:attempt['status']='not_run_case_preflight_blocked';continue
                  if time.monotonic()-start>24*60:attempt['status']='not_run_job_budget';continue
                  name='lighthouse'+n+'-'+agent;before=ids('containers');began=time.monotonic();events=None;ef=None
                  folder=P('trials')/name
                  attempt['log_recovery_accepted']=False
                  try:
                      ef=(private/(name+'-events.jsonl')).open('wb');events=subprocess.Popen(['docker','events','--format','{{json .}}'],stdout=ef,stderr=subprocess.DEVNULL)
                      attempt['fresh_harbor_execution']=True
                      # Keep only these ephemeral task containers for verifier evidence inspection.
                      # Stock task config, egress helper and criteria remain unchanged.
                      with (private/(name+'.log')).open('wb') as f:r=subprocess.run([cli,'trials','start','--path',str(task),'--env','docker','--agent',agent,'--trial-name',name,'--trials-dir',str(P('trials').resolve()),'--no-force-build','--no-delete','--environment-kwarg','keep_containers=true'],stdout=f,stderr=f,timeout=300)
                      attempt['cli_exit']=r.returncode;folder=P('trials')/name
                      if (folder/'result.json').is_file():
                          result=json.loads((folder/'result.json').read_text());attempt['error_category']=error_category(result.get('exception_info')) if result.get('exception_info') else None;attempt['private_result_sha256']=sha(folder/'result.json');attempt['exception_type']=(result.get('exception_info') or {}).get('exception_type');attempt['harbor_rewards']=(result.get('verifier_result') or {}).get('rewards')
                          report=folder/'verifier/report.json';reward=folder/'verifier/reward.txt'
                          source_path='/tmp/harbor-submission/model.patch'
                          manifest=folder/'artifacts/manifest.json'
                          proof=folder/'verifier/submission.json'
                          evidence_ok=False
                          if manifest.is_file() and proof.is_file():
                              entries=[e for e in json.loads(manifest.read_text()) if e['source']==source_path and e['status']=='ok' and e['type']=='file']
                              if len(entries)==1:
                                  actual=folder/entries[0]['destination']; assert actual.resolve().is_relative_to((folder/'artifacts').resolve())
                                  attestation=json.loads(proof.read_text())
                                  same=sha(actual)==attestation['submission_sha256']
                                  empty=actual.stat().st_size==0
                                  def patchid(p):
                                      with p.open('rb') as stream:
                                          out=subprocess.check_output(['git','patch-id','--stable'],stdin=stream,text=True).split()
                                      return out[0] if len(out)==2 else None
                                  expected_patch=(actual.is_file() and not empty and patchid(actual) is not None and patchid(actual)==patchid(task/'solution/gold.patch')) if agent=='oracle' else empty
                                  evidence_ok=same and expected_patch and attestation['empty_submission']==empty and attestation['submission_bytes']==actual.stat().st_size and attestation['base_commit']=='e5fdadd8272ca456afb5dcd4b52c8e67f7d9e73c'
                                  attempt['submission']={'manifest_ok':True,'sha256':sha(actual),'bytes':actual.stat().st_size,'expected_patch':expected_patch,'verifier_digest_matches':same,'accepted':evidence_ok}
                          if report.is_file() and reward.is_file():
                              q=json.loads(report.read_text());v=float(reward.read_text().strip());expected=1.0 if agent=='oracle' else 0.0
                              attempt.update(reward=v,resolved=q.get('resolved'),valid_test_output=q.get('valid_test_output'),per_test=q.get('tests_status'))
                              declared=json.loads((task/'tests/tests.json').read_text())
                              f2p=q['tests_status']['FAIL_TO_PASS'];p2p=q['tests_status']['PASS_TO_PASS']
                              f2p_ok=(f2p['success']==declared['FAIL_TO_PASS'] and not f2p['failure']) if agent=='oracle' else (f2p['failure']==declared['FAIL_TO_PASS'] and not f2p['success'])
                              buckets_ok=f2p_ok and len(declared['FAIL_TO_PASS'])==4 and p2p['success']==declared['PASS_TO_PASS'] and len(p2p['success'])==1 and not p2p['failure']
                              attempt['status']='expected_semantic_result' if r.returncode==0 and evidence_ok and buckets_ok and v==expected and q.get('valid_test_output') and not result.get('exception_info') and (result.get('verifier_result') or {}).get('rewards',{}).get('reward')==expected else 'semantic_or_infrastructure_mismatch'
                          else:attempt['status']='missing_exported_grading_evidence'
                      else:attempt['status']='missing_harbor_result'
                      output=folder/'verifier/test_output.log'
                      if output.is_file() and output.stat().st_size>0:
                          attempt['test_output_sha256']=sha(output);txt=output.read_text(errors='replace');attempt['dependency_resync_observed']='package.json changed by patch; re-syncing dependencies' in txt.splitlines()
                  except subprocess.TimeoutExpired:attempt['status']='outer_diagnostic_budget_timeout'
                  except Exception as exc:attempt.update(status='diagnostic_error',error_type=type(exc).__name__)
                  finally:
                      containers=[]
                      def copied_hash(container_id, source_path, name):
                          target=private/name
                          process=subprocess.run(['docker','cp',container_id+':'+source_path,str(target)],capture_output=True,text=True,timeout=15)
                          if process.returncode==0 and target.is_file() and not target.is_symlink():return (sha(target),False)
                          return (None,process.returncode!=0 and 'could not find the file' in process.stderr.lower())
                      for cid in ids('containers')-before:
                          d=json.loads(subprocess.check_output(['docker','inspect',cid],text=True))[0]
                          labels=d['Config']['Labels'] or {}
                          project=labels.get('com.docker.compose.project','')
                          if labels.get('com.docker.compose.service')=='main' and project.startswith(name):
                              hc=d['HostConfig']
                              role='verifier' if '__verifier__' in project else 'agent'
                              log_match={}
                              if role=='verifier':
                                  for artifact in ('test_output.log','reward.txt','report.json','submission.json'):
                                      exported=folder/'verifier'/artifact
                                      digest,_=copied_hash(cid,'/logs/verifier/'+artifact,name+'-runtime-'+artifact)
                                      log_match[artifact]=bool(digest and exported.is_file() and digest==sha(exported))
                              control_hash,_=copied_hash(cid,'/testbed/package.json',name+'-'+role+'-control')
                              probes={f:copied_hash(cid,'/tests/'+f,name+'-'+role+'-'+f) for f in ('test.sh','grade.py','tests.json','task_metadata.json')}
                              if role=='agent':
                                  correct_test_visibility=control_hash is not None and all(missing for _,missing in probes.values())
                              else:
                                  correct_test_visibility=all(digest==sha(task/'tests'/f) for f,(digest,_) in probes.items())
                              containers.append({'id_prefix':cid[:12],'role':role,'image':d['Image'],'privileged':hc['Privileged'],'cap_add':hc['CapAdd'] or [],'host_network':hc['NetworkMode']=='host','tests_mount':any(m['Destination']=='/tests' for m in d['Mounts']),'verifier_log_mount':any(m['Destination']=='/logs/verifier' for m in d['Mounts']),'expected_test_file_visibility':correct_test_visibility,'verifier_log_matches':log_match,'runtime_logs_match_export':len(log_match)==4 and all(log_match.values())})
                      attempt['containers']=containers
                      separation=len(containers)==2 and {c['role'] for c in containers}=={'agent','verifier'} and len({c['id_prefix'] for c in containers})==2 and len({c['image'] for c in containers})==1 and all(not c['privileged'] and not c['cap_add'] and not c['host_network'] and c['expected_test_file_visibility'] for c in containers) and all(not c['tests_mount'] for c in containers if c['role']=='agent')
                      attempt['log_recovery_accepted']=bool(attempt.get('test_output_sha256')) and any(c['role']=='verifier' and c['runtime_logs_match_export'] for c in containers)
                      attempt['separation_accepted']=separation
                      if events:
                          events.terminate()
                          try:events.wait(timeout=5)
                          except subprocess.TimeoutExpired:events.kill()
                      if ef:ef.close()
                      ep=private/(name+'-events.jsonl');et=ep.read_text(errors='replace') if ep.exists() else ''
                      def is_verifier_deny_event(line):
                          try:event=json.loads(line)
                          except ValueError:return False
                          attributes=event.get('Actor',{}).get('Attributes',{})
                          action=event.get('Action','')
                          project=attributes.get('com.docker.compose.project','')
                          container_name=attributes.get('name','')
                          target=project or container_name
                          return action.startswith('exec_create:') and 'deny-all' in action and target.startswith(name+'__verifier__')
                      attempt['deny_all_exec_events']=sum('deny-all' in x and 'exec_create' in x for x in et.splitlines())
                      attempt['verifier_deny_all_exec_events']=sum(is_verifier_deny_event(x) for x in et.splitlines())
                      attempt['grading_accepted']=attempt.get('status')=='expected_semantic_result' and attempt['verifier_deny_all_exec_events']>0 and attempt['separation_accepted'] and attempt['log_recovery_accepted']
                      cleanup_containers(before);attempt['seconds']=round(time.monotonic()-began,2)
              if setup_ok:
                  for iid in ids('images')-before_images:subprocess.run(['docker','image','rm','-f',iid],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=25)
          summary['seconds']=round(time.monotonic()-start,2)
          assert len(summary['attempts'])==2
          summary['all_required_grades_accepted']=all(x.get('grading_accepted',False) for x in summary['attempts'])
          summary['diagnostic_accepted']=summary['all_required_grades_accepted']
          summary['failure_marker']=None if summary['diagnostic_accepted'] else 'DIAGNOSTIC_NOT_ACCEPTED'
          print('SANITIZED_SUMMARY '+json.dumps(summary),flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('## Lighthouse 1549 exact-adapter Harbor diagnostic\nOnly sanitized outcomes; raw logs ephemeral. Not full480 or model parity.\n```json\n'+json.dumps(summary,indent=2)+'\n```\n')
          if not summary['diagnostic_accepted']:raise SystemExit(1)
          PY
