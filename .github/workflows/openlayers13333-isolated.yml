dence, stream)\n    return evidence\n\n\ndef official_f2p_observation(text):\n    rows = []\n    for line in text.splitlines():\n        if "cases/icon-opacity/main.js" not in line:\n            continue\n        match = LINE.search(line)\n        if match is not None and match["case"] == "icon-opacity":\n            rows.append(match["result"])\n        elif re.search(r"\\bcase .*cases/icon-opacity/main\\.js", line):\n            raise ValueError("unrecognized or skipped icon-opacity observation")\n    if len(rows) != 1:\n        raise ValueError("missing or duplicate icon-opacity observation")\n    return rows[0]\n\n\ndef check_output(log_path, postrestore_path):\n    seen = json.loads(postrestore_path.read_text())\n    if seen != {str(p): value for p, value in ASSETS.items()}:\n        raise ValueError("invalid or missing post-restore hashes")\n    raw = log_path.read_bytes()\n    txt = re.sub(r"\\x1b\\[[0-?]*[ -/]*[@-~]", "", raw.decode(errors="replace"))\n    return {"named_rendering_comparisons": comparison_evidence(txt), "official_f2p_render_observation": official_f2p_observation(txt), "raw_sha256": sha(raw)}\n\n\ndef main():\n    mode = argparse.ArgumentParser()\n    mode.add_argument("phase", choices=("prepare", "postrestore", "verify-result"))\n    args = mode.parse_args()\n    if args.phase == "prepare":\n        for root in (AGENT_CHECKOUT, STAGING):\n            for rel in ASSETS:\n                candidate = root / rel\n                if candidate.exists() or candidate.is_symlink():\n                    raise ValueError("reference readable before verifier staging")\n        tree = subprocess.run(["git", "-c", "safe.directory=/testbed", "-C", str(AGENT_CHECKOUT), "ls-tree", "HEAD", "--"] + [str(p) for p in ASSETS], capture_output=True, check=True)\n        if tree.stdout.strip():\n            raise ValueError("reference tracked in checked-out Git tree")\n        (LOG_DIR / "before-stage-absence.json").write_text(json.dumps({"two_checkout_paths_absent":