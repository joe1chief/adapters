name: One-shot pinned Harbor Grommet 2061
on:
  push:
    branches: [diagnostic/grommet2061-harbor-20261117]
    paths: [.github/workflows/grommet2061-harbor-e2e.yml]
permissions:
  contents: read
concurrency:
  group: grommet2061-harbor-once-20261117
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Grommet 2061 exact-adapter oracle and no-op
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,platform,shutil,subprocess,time,urllib.request
          P=pathlib.Path
          start=time.monotonic();private=P('private-run-data');private.mkdir()
          adapter='020529b6433a3c045a09c76dee281489eca474a4';harbor='1e5c5c6db929a10a140d05e606882c671ae20729';source='8d3ed32f37af9ceb8b5778b92a0088384ed057d4'
          cases=[{'id': '2061', 'image': 'swebench/sweb.eval.x86_64.grommet_1776_grommet-2061@sha256:0fee0191d949f36b76327594ce4dd26200fa4fdbe1198838e62f0b8f909e299f', 'inputs': {'test.patch': 'a32a2d052bb7ed80c43a61d308b6619fa9c00da6e317261c31ac9cc24e0b6a2e', 'problem_statement.md': '70018808a6a7c537ebe63e5d328ccd3e3f1cb77cebe9b9dc330fdbc925b86916', 'eval.sh': '740ca83b10f1f138ab71041cdcda5c66f5a4e32c1913868af38e42440469b80e', 'tests.json': '074592f772eba264af0360a7e295dd5202a3b5bfd6ca8c0529a0d7c334e81bac', 'Dockerfile': '113c7af5c585b9ba4ea9bf3f397ecbbd2c40ee2269df247d6f6d82daf4302470', 'gold.patch': '01d722cb72d3fbc9437611694f3a6b52a941d07cf1e308b07c3e8398ac72f10d', 'task.yaml': '3bcc0a2032012dac7d08c03977fa84ce4856aa85374929487c4626acfa94bd79', 'problem_assets/1-38843203-e689b1b0-41bb-11e8-87ca-5b9c727300e8.jpg': '15a2c34122b04725a528b15f32868ee094aa267b3ef122331afff36388b44f88', 'problem_assets/0-38843188-d0a0325c-41bb-11e8-8357-c686034af89d.jpg': '12e3f10646b83283adf5ead750f2788172b823c11300ef8f97274a01386d0b43'}}]
          summary={'adapter_commit':adapter,'harbor_commit':harbor,'task_source_commit':source,'model_calls':0,'scope':'Grommet 2061 original oracle/nop only, not full480 or model parity','attempts':[]}
          stage='setup'
          def execute(argv,timeout=120,cwd=None):
              with (private/'setup.log').open('ab') as f:p=subprocess.run(argv,cwd=cwd,stdout=f,stderr=subprocess.STDOUT,timeout=timeout)
              if p.returncode:raise RuntimeError('command_nonzero')
          def checkout(repo,commit,dest):
              execute(['git','init','-q',dest]);execute(['git','-C',dest,'fetch','--depth','1',repo,commit],180);execute(['git','-C',dest,'checkout','--detach','FETCH_HEAD'])
              assert subprocess.check_output(['git','-C',dest,'rev-parse','HEAD'],text=True).strip()==commit
          def error_category(info):
              text=json.dumps(info).lower()
              if any(x in text for x in ['pull access denied','failed to resolve source metadata','failed to resolve reference']):return 'image_resolution'
              if 'no space left on device' in text:return 'disk_exhausted'
              if 'timed out' in text or 'timeout' in text:return 'timeout'
              if 'docker compose' in text and 'build' in text:return 'compose_build'
              if 'docker compose' in text and 'up' in text:return 'compose_start'
              return 'unclassified_infrastructure'
          def dependency_snapshot(cid,label):
              result={}
              for name,path in [('package','/testbed/package.json'),('lock','/testbed/yarn.lock'),('integrity','/testbed/node_modules/.yarn-integrity')]:
                  dest=private/(label+'-'+name)
                  rc=subprocess.run(['docker','cp',cid+':'+path,str(dest)],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=15).returncode
                  result[name+'_sha256']=sha(dest) if rc==0 else None
                  if rc==0 and name=='integrity':
                      try:
                          data=json.loads(dest.read_text());result['integrity_top_level_count']=len(data.get('topLevelPatterns',[]));result['integrity_lock_entries_count']=len(data.get('lockfileEntries',{}))
                      except ValueError:result['integrity_parse_error']=True
              return result
          def sha(p):return hashlib.sha256(P(p).read_bytes()).hexdigest()
          def ids(kind):
              cmd=['docker','ps','-aq'] if kind=='containers' else ['docker','image','ls','-q','--no-trunc']
              return set(subprocess.check_output(cmd,text=True).split())
          def cleanup_containers(before):
              for cid in ids('containers')-before:subprocess.run(['docker','rm','-f',cid],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=20)
          setup_ok=False
          try:
              assert platform.machine()=='x86_64' and shutil.disk_usage('.').free>9*1024**3
              execute(['docker','compose','version'])
              stage='checkout';checkout('https://github.com/joe1chief/adapters.git',adapter,'adapter-source');checkout('https://github.com/harbor-framework/harbor.git',harbor,'harbor-source')
              stage='locked_dependencies';execute(['python3','-m','venv','bootstrap']);execute(['bootstrap/bin/pip','install','uv==0.8.22'],120)
              execute([str(P('bootstrap/bin/uv').resolve()),'sync','--frozen','--no-dev','--python','3.12'],420,'harbor-source')
              py=str(P('harbor-source/.venv/bin/python').resolve());cli=str(P('harbor-source/.venv/bin/harbor').resolve());summary['harbor_lock_sha256']=sha('harbor-source/uv.lock');setup_ok=True
          except Exception as exc:summary['setup_error']={'stage':stage,'error_type':type(exc).__name__}
          for case in cases:
              n=case['id'];image=case['image'];case_ok=False;before_images=ids('images') if setup_ok else set()
              case_summary={'task':n,'image':image,'source_sha256':case['inputs']};summary.setdefault('cases',[]).append(case_summary)
              try:
                  if not setup_ok:raise RuntimeError('setup_incomplete')
                  if time.monotonic()-start>23*60:raise TimeoutError('budget')
                  if shutil.disk_usage('.').free<7*1024**3:raise OSError('insufficient_disk')
                  stage='public_inputs';td=P('task-source')/('grommet__grommet-'+n);td.mkdir(parents=True)
                  for name,digest in case['inputs'].items():
                      dest=td/name;dest.parent.mkdir(parents=True,exist_ok=True)
                      url='https://raw.githubusercontent.com/SWE-bench/swe-bench-multimodal-tasks/'+source+'/tasks/grommet__grommet-'+n+'/'+name
                      with urllib.request.urlopen(url,timeout=40) as r:dest.write_bytes(r.read())
                      assert sha(dest)==digest
                  meta=td/'task.yaml';text=meta.read_text();old='image: swebench/sweb.eval.x86_64.grommet_1776_grommet-'+n+':latest';assert text.count(old)==1;meta.write_text(text.replace(old,'image: '+image))
                  stage='generate_exact_adapter';env=dict(os.environ);env['PYTHONPATH']=str(P('adapter-source/src/swebench-multimodal/src').resolve())
                  with (private/(n+'-generation.log')).open('wb') as f:subprocess.run([py,'-m','swebench_multimodal.main','--source-dir','task-source','--output-dir','generated','--task-ids','grommet__grommet-'+n],env=env,stdout=f,stderr=f,check=True,timeout=60)
                  task=P('generated/grommet-grommet-'+n).resolve();assert task.is_dir()
                  for generated,original in [('tests/eval.sh','eval.sh'),('solution/gold.patch','gold.patch'),('tests/tests.json','tests.json')]:assert sha(task/generated)==case['inputs'][original]
                  case_summary['task_toml_sha256']=sha(task/'task.toml')
                  stage='pull_fixed_image';execute(['docker','pull','--platform','linux/amd64',image],150)
                  detail=json.loads(subprocess.check_output(['docker','image','inspect',image],text=True))[0];assert detail['Architecture']=='amd64' and detail['Os']=='linux';case_summary['image_id']=detail['Id']
                  base_container=subprocess.check_output(['docker','create','--network','none',image],text=True).strip()
                  try:case_summary['baseline_dependency_snapshot']=dependency_snapshot(base_container,'baseline')
                  finally:execute(['docker','rm',base_container])
                  case_ok=True
              except Exception as exc:case_summary.update(status='case_preflight_blocked',stage=stage,error_type=type(exc).__name__)
              for agent in ['oracle','nop']:
                  attempt={'task':n,'agent':agent,'fresh_harbor_execution':False};summary['attempts'].append(attempt)
                  if not case_ok:attempt['status']='not_run_case_preflight_blocked';continue
                  if time.monotonic()-start>24*60:attempt['status']='not_run_job_budget';continue
                  name='grommet'+n+'-'+agent;before=ids('containers');began=time.monotonic();events=None;ef=None
                  try:
                      ef=(private/(name+'-events.jsonl')).open('wb');events=subprocess.Popen(['docker','events','--format','{{json .}}'],stdout=ef,stderr=subprocess.DEVNULL)
                      attempt['fresh_harbor_execution']=True
                      # Keep only these ephemeral task containers for post-verifier dependency inspection.
                      # Stock task config, egress helper and criteria remain unchanged.
                      with (private/(name+'.log')).open('wb') as f:r=subprocess.run([cli,'trials','start','--path',str(task),'--env','docker','--agent',agent,'--trial-name',name,'--trials-dir',str(P('trials').resolve()),'--no-force-build','--no-delete','--environment-kwarg','keep_containers=true'],stdout=f,stderr=f,timeout=300)
                      attempt['cli_exit']=r.returncode;folder=P('trials')/name
                      if (folder/'result.json').is_file():
                          result=json.loads((folder/'result.json').read_text());attempt['error_category']=error_category(result.get('exception_info')) if result.get('exception_info') else None;attempt['private_result_sha256']=sha(folder/'result.json');attempt['exception_type']=(result.get('exception_info') or {}).get('exception_type');attempt['harbor_rewards']=(result.get('verifier_result') or {}).get('rewards')
                          report=folder/'verifier/report.json';reward=folder/'verifier/reward.txt'
                          if report.is_file() and reward.is_file():
                              q=json.loads(report.read_text());v=float(reward.read_text().strip());expected=1.0 if agent=='oracle' else 0.0
                              attempt.update(reward=v,resolved=q.get('resolved'),valid_test_output=q.get('valid_test_output'),per_test=q.get('tests_status'))
                              attempt['status']='expected_semantic_result' if v==expected and q.get('valid_test_output') and not result.get('exception_info') and (result.get('verifier_result') or {}).get('rewards',{}).get('reward')==expected else 'semantic_or_infrastructure_mismatch'
                          else:attempt['status']='missing_exported_grading_evidence'
                      else:attempt['status']='missing_harbor_result'
                      output=folder/'verifier/test_output.log'
                      if output.exists():
                          attempt['test_output_sha256']=sha(output);txt=output.read_text(errors='replace');attempt['dependency_resync_observed']='package.json changed by patch; re-syncing dependencies' in txt.splitlines()
                  except subprocess.TimeoutExpired:attempt['status']='outer_diagnostic_budget_timeout'
                  except Exception as exc:attempt.update(status='diagnostic_error',error_type=type(exc).__name__)
                  finally:
                      # Read JSON only, do not load dependency code or call npm/yarn beyond original eval.
                      dependency=[]
                      for cid in ids('containers')-before:
                          snap=dependency_snapshot(cid,name+'-'+cid[:12])
                          if snap['package_sha256'] is not None:dependency.append(snap)
                      attempt['post_verifier_dependency_snapshots']=dependency
                      baseline=case_summary['baseline_dependency_snapshot']
                      attempt['manifest_lock_unchanged']=len(dependency)==1 and all(baseline.get(k) is not None and dependency[0].get(k)==baseline[k] for k in ['package_sha256','lock_sha256'])
                      attempt['integrity_record_unchanged']=len(dependency)==1 and baseline.get('integrity_sha256') is not None and dependency[0].get('integrity_sha256')==baseline['integrity_sha256']
                      attempt['installed_transitive_versions_verified']=False
                      attempt['dependency_evidence_scope']='Manifest, lock and Yarn integrity record hashes only; not installed-files closure or installer exit status'
                      if events:
                          events.terminate()
                          try:events.wait(timeout=5)
                          except subprocess.TimeoutExpired:events.kill()
                      if ef:ef.close()
                      ep=private/(name+'-events.jsonl');et=ep.read_text(errors='replace') if ep.exists() else ''
                      attempt['deny_all_exec_events']=sum('deny-all' in x and 'exec_create' in x for x in et.splitlines())
                      attempt['grading_accepted']=attempt.get('status')=='expected_semantic_result' and attempt['deny_all_exec_events']>0
                      attempt['static_dependency_alignment_accepted']=attempt['manifest_lock_unchanged'] and attempt['integrity_record_unchanged']
                      cleanup_containers(before);attempt['seconds']=round(time.monotonic()-began,2)
              if setup_ok:
                  for iid in ids('images')-before_images:subprocess.run(['docker','image','rm','-f',iid],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=25)
          summary['seconds']=round(time.monotonic()-start,2)
          assert len(summary['attempts'])==2
          summary['all_required_grades_accepted']=all(x.get('grading_accepted',False) for x in summary['attempts'])
          summary['all_required_static_dependency_checks_accepted']=all(x.get('static_dependency_alignment_accepted',False) for x in summary['attempts'])
          summary['diagnostic_accepted']=summary['all_required_grades_accepted'] and summary['all_required_static_dependency_checks_accepted']
          summary['failure_marker']=None if summary['diagnostic_accepted'] else 'DIAGNOSTIC_NOT_ACCEPTED'
          print('SANITIZED_SUMMARY '+json.dumps(summary),flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('## Grommet 2061 exact-adapter Harbor diagnostic\nOnly sanitized outcomes; raw logs ephemeral. Not full480 or model parity.\n```json\n'+json.dumps(summary,indent=2)+'\n```\n')
          if not summary['diagnostic_accepted']:raise SystemExit(1)
          PY
