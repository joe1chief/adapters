name: Dataset 262 rebuilt starters
'on':
  push:
    branches:
    - diagnostic/dataset262-starters-20261123
    paths:
    - .github/workflows/dataset262-starters.yml
permissions:
  contents: read
concurrency:
  group: dataset262-starters
  cancel-in-progress: false
jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Check out exact adapter commit
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      with:
        repository: joe1chief/adapters
        ref: 9399d5399ec893b294220045186ca88d0ec2b1b4
        path: adapter-source
        persist-credentials: false
        fetch-depth: 1
        show-progress: false
    - name: Check out exact Harbor v0.27.0 commit
