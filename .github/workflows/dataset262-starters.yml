            stage='verify_exact_checkout'
            for repo_dir, expected in [('adapter-source',adapter),('harbor-source',harbor)]:
                assert subprocess.check_output(['git','-C',repo_dir,'rev-parse','--verify','HEAD'],text=True).strip()==expected
            assert subprocess.check_output(['git','-C','adapter-source','status','--porcelain=v1','--untracked-files=all'])==b''
            summary['exact_checkouts_verified']=True
            stage='locked_dependencies';execute(['python3','-m','venv','bootstrap']);execute(['bootstrap/bin/pip','install','uv==0.13.9'],120)
            execute([str(P('bootstrap/bin/uv').resolve()),'sync','--frozen','--no-dev','--python','3.12'],420,'harbor-source')
            py=str(P('harbor-source/.venv/bin/python').resolve());cli=str(P('harbor-source/.venv/bin/harbor').resolve());summary['harbor_lock_sha256']=sha('harbor-source/uv.lock');assert summary['harbor_lock_sha256']=='d411f1b7d259023d8ec2f920d7b8faedcf3b895e2320c2c0b5a606f3e1c2b960';assert subprocess.check_output(['git','hash-object','uv.lock'],cwd='harbor-source',text=True).strip()=='372259f90db33a133db683070411c914aad0057b';setup_ok=True
        except Exception as exc:summary['setup_error']={'stage':stage,'error_type':type(exc).__name__}
        for case in cases:
            n=case['id'];image=case['image'];case_ok=False;before_images=ids('images') if setup_ok else set()
            case_summary={'task':n,'image':image,'source_sha256':case['inputs']};summary.setdefault('cases',[]).append(case_summary)
            try:
                if not setup_ok:raise RuntimeError('setup_incomplete')
                if time.monotonic()-start>23*60:raise TimeoutError('budget')
                if shutil.disk_usage('.').free<7*1024**3:raise OSError('insufficient_disk')
                stage='public_inputs';td=P('task-source')/('GoogleChrome__lighthouse-'+n);td.mkdir(parents=True)
                for name,digest in case['inputs'].items():
                    dest=td/name;dest.parent.mkdir(parents=True,exist_ok=True)
                    url='https://raw.githubusercontent.com/SWE-bench/swe-bench-multimodal-tasks/'+source+'/tasks/GoogleChrome__lighthouse-'+n+'/'+name
                    with urllib.request.urlopen(url,timeout=40) as r:dest.write_bytes(r.read())
                    assert sha(dest)==digest
                stage='generate_exact_adapter';env=dict(os.environ);env['PYTHONPATH']=str(P('adapter-source/src/swebench-multimodal/src').resolve())
                with (private/(n+'-generation.log')).open('wb') as f:subprocess.run([py,'-m','swebench_multimodal.main','--source-dir','task-source','--output-dir','generated','--task-ids','GoogleChrome__lighthouse-'+n],env=env,stdout=f,stderr=f,check=True,timeout=60)
                task=P('generated/googlechrome-lighthouse-'+n).resolve();assert task.is_dir()
                for generated,original in [('tests/eval.sh','eval.sh'),('solution/gold.patch','gold.patch'),('tests/test.patch','test.patch'),('tests/tests.json','tests.json')]:assert sha(task/generated)==case['inputs'][original]
                for public_asset in (f for f in case['inputs'] if f.startswith('problem_assets/')):
                    assert sha(task/public_asset)==sha(task/'environment'/public_asset)==case['inputs'][public_asset]
                stage='verify_uninstrumented_generated_task'
                exact={'environment/Dockerfile': 'd69aa79ff70a52a22816834a89d0d95b5415bd92bf963d7e95089c90197a7dd9', 'environment/problem_assets/.gitkeep': 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855', 'environment/problem_assets/0-27e874c6-8f15-11e6-9e6c-1a9407a64d14.png': '08ce0dd8939e619fe96360eb6a8adc368acbd70217096ddf5e97df16b738a0c7', 'environment/snapshot-and-collect.sh': '17adaa4dc5f3b80eea63dc05ad5e1e280fd1214c70cd79d70178d9b913e21c81', 'instruction.md': '0d48f33fab9f63a93a4232ed1084d650c709d9775de9e1fc0eee756c56f6cc68', 'problem_assets/0-27e874c6-8f15-11e6-9e6c-1a9407a64d14.png': '08ce0dd8939e619fe96360eb6a8adc368acbd70217096ddf5e97df16b738a0c7', 'solution/gold.patch': '5df9b0e82561b0080c5981ad8c0d13bf7392467e27a00671a97bd10a44a4f305', 'solution/solve.sh': 'f3ddb5b90bc837ba9cb552c7a6aa5dbea8fd48a62283a29c0692fbf2fc6a15ed', 'task.toml': '04317b299b66c23b223feed407282d2966b1efccb053aff14dc7dadc99297029', 'tests/SWEBENCH_LICENSE': '2bd2e08df7147f67a69b42c10efae09bd4bf119df397371036187d5dd1b02f57', 'tests/apply_submission.py': '2f9cacd5cf1f3596d5a63d278d8a9ae5be657a5ff22dbb0321523d6c6ef6af25', 'tests/eval.sh': 'e0e6b83ededb55e546a4e17b0904b9a7da47bdc13c89fc6895519e9bb3b5632f', 'tests/grade.py': 'ccf08f2d1de503999722669141caf4af9e9e92d06f85260973446ee1d6ff5808', 'tests/task_metadata.json': 'bf70f9bf32a46780670f271c9a940de2f4820f43189c14faed6e19c9f9add88f', 'tests/test.patch': '4c92b5224bc9c3abfb258022ee4bb00e394d9ab5b51d27772942a820ed1eb8a5', 'tests/test.sh': 'a6603ef4cf638605350073126512cd4b6c78f9dd5768af3d0071c8e3cae31fea', 'tests/tests.json': '7b8155f54c12e091a3e97d841b25308b6fdb5b7fc4ca398c2954622ff0a742da', 'tests/upstream.py': 'b6e50637352b17bbbec02315c0b26bac3da49693a24e508871ec5c052033f5c5'}
                actual={f.relative_to(task).as_posix():sha(f) for f in task.rglob('*') if f.is_file()}
                assert actual==exact, 'generated tree differs from local pinned build'
                case_summary['exact_generated_sha256']=actual
                assert (task/'environment/Dockerfile').read_text().splitlines()[0]=='FROM '+image
                assert sha(td/'task.yaml')==case['inputs']['task.yaml']
                task_config=tomllib.loads((task/'task.toml').read_text())
                assert task_config['verifier']['environment_mode']=='separate' and task_config['verifier']['network_mode']=='no-network'
                assert task_config['artifacts']==['/tmp/harbor-submission/model.patch']
                case_summary['task_toml_sha256']=sha(task/'task.toml')
                stage='pull_fixed_image';execute(['docker','pull','--platform','linux/amd64',image],150)
                detail=json.loads(subprocess.check_output(['docker','image','inspect',image],text=True))[0];assert detail['Architecture']=='amd64' and detail['Os']=='linux' and detail['Id']=='sha256:164971a1f1e387e2fa30a450428e5667a19864e9035572b109a359a343073b69';case_summary['image_id']=detail['Id']
                case_ok=True
            except Exception as exc:case_summary.update(status='case_preflight_blocked',stage=stage,error_type=type(exc).__name__)
            for agent in ['oracle','nop']:
                attempt={'task':n,'agent':agent,'fresh_harbor_execution':False};summary['attempts'].append(attempt)
                if not case_ok:attempt['status']='not_run_case_preflight_blocked';continue
                if time.monotonic()-start>24*60:attempt['status']='not_run_job_budget';continue
                name='lighthouse'+n+'-'+agent;before=ids('containers');began=time.monotonic();events=None;ef=None
                folder=P('trials')/name
                attempt['log_recovery_accepted']=False
                try:
                    ef=(private/(name+'-events.jsonl')).open('wb');events=subprocess.Popen(['docker','events','--format','{{json .}}'],stdout=ef,stderr=subprocess.DEVNULL)
                    attempt['fresh_harbor_execution']=True
                    # Keep only these ephemeral task containers for verifier evidence inspection.
                    # Stock task config, egress helper and criteria remain unchanged.
                    with (private/(name+'.log')).open('wb') as f:r=subprocess.run([cli,'trials','start','--path',str(task),'--env','docker','--agent',agent,'--trial-name',name,'--trials-dir',str(P('trials').resolve()),'--no-force-build','--no-delete','--environment-kwarg','keep_containers=true'],stdout=f,stderr=f,timeout=300)
                    attempt['cli_exit']=r.returncode;folder=P('trials')/name
                    if (folder/'result.json').is_file():
                        result=json.loads((folder/'result.json').read_text());attempt['error_category']=error_category(result.get('exception_info')) if result.get('exception_info') else None;attempt['private_result_sha256']=sha(folder/'result.json');attempt['exception_type']=(result.get('exception_info') or {}).get('exception_type');attempt['harbor_rewards']=(result.get('verifier_result') or {}).get('rewards')
                        report=folder/'verifier/report.json';reward=folder/'verifier/reward.txt'
                        source_path='/tmp/harbor-submission/model.patch'
                        manifest=folder/'artifacts/manifest.json'
                        proof=folder/'verifier/submission.json'
                        evidence_ok=False
                        if manifest.is_file() and proof.is_file():
                            entries=[e for e in json.loads(manifest.read_text()) if e['source']==source_path and e['status']=='ok' and e['type']=='file']
                            if len(entries)==1:
                                actual=folder/entries[0]['destination']; assert actual.resolve().is_relative_to((folder/'artifacts').resolve())
                                attestation=json.loads(proof.read_text())
                                same=sha(actual)==attestation['submission_sha256']
                                empty=actual.stat().st_size==0
                                def patchid(p):
                                    with p.open('rb') as stream:
                                        out=subprocess.check_output(['git','patch-id','--stable'],stdin=stream,text=True).split()
                                    return out[0] if len(out)==2 else None
                                expected_patch=(actual.is_file() and not empty and patchid(actual) is not None and patchid(actual)==patchid(task/'solution/gold.patch')) if agent=='oracle' else empty
                                evidence_ok=same and expected_patch and attestation['empty_submission']==empty and attestation['submission_bytes']==actual.stat().st_size and attestation['base_commit']=='e5fdadd8272ca456afb5dcd4b52c8e67f7d9e73c'
                                attempt['submission']={'manifest_ok':True,'sha256':sha(actual),'bytes':actual.stat().st_size,'expected_patch':expected_patch,'verifier_digest_matches':same,'accepted':evidence_ok}
                        if report.is_file() and reward.is_file():
                            q=json.loads(report.read_text());v=float(reward.read_text().strip());expected=1.0 if agent=='oracle' else 0.0
                            attempt.update(reward=v,resolved=q.get('resolved'),valid_test_output=q.get('valid_test_output'),per_test=q.get('tests_status'))
                            declared=json.loads((task/'tests/tests.json').read_text())
                            f2p=q['tests_status']['FAIL_TO_PASS'];p2p=q['tests_status']['PASS_TO_PASS']
                            f2p_ok=(f2p['success']==declared['FAIL_TO_PASS'] and not f2p['failure']) if agent=='oracle' else (f2p['failure']==declared['FAIL_TO_PASS'] and not f2p['success'])
                            buckets_ok=f2p_ok and len(declared['FAIL_TO_PASS'])==4 and p2p['success']==declared['PASS_TO_PASS'] and len(p2p['success'])==1 and not p2p['failure']
                            attempt['status']='expected_semantic_result' if r.returncode==0 and evidence_ok and buckets_ok and v==expected and q.get('valid_test_output') and not result.get('exception_info') and (result.get('verifier_result') or {}).get('rewards',{}).get('reward')==expected else 'semantic_or_infrastructure_mismatch'
                        else:attempt['status']='missing_exported_grading_evidence'
                    else:attempt['status']='missing_harbor_result'
                    output=folder/'verifier/test_output.log'
                    if output.is_file() and output.stat().st_size>0:
                        attempt['test_output_sha256']=sha(output);txt=output.read_text(errors='replace');attempt['dependency_resync_observed']='package.json changed by patch; re-syncing dependencies' in txt.splitlines()
                except subprocess.TimeoutExpired:attempt['status']='outer_diagnostic_budget_timeout'
                except Exception as exc:attempt.update(status='diagnostic_error',error_type=type(exc).__name__)
                finally:
