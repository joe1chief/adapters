      with:
        repository: harbor-framework/harbor
        ref: 96c86af3bc6d7e92f21fc771d21273be4714c8e9
        path: harbor-source
        persist-credentials: false
        fetch-depth: 1
        show-progress: false
    - name: lighthouse pinned dataset starter oracle and no-op
      shell: bash
      run: |
        set -euo pipefail
        cd "${GITHUB_WORKSPACE:?}"
        export LIGHTHOUSE_PRIVATE_DIR="$(mktemp -d "${RUNNER_TEMP:?}/lighthouse1549.XXXXXXXX")"
        trap 'rm -rf -- "$LIGHTHOUSE_PRIVATE_DIR"' EXIT
        python3 - <<'PY'
        import re,hashlib,json,os,pathlib,tomllib,platform,shutil,subprocess,time,urllib.request
        P=pathlib.Path
        start=time.monotonic();private=P(os.environ['LIGHTHOUSE_PRIVATE_DIR'])
        adapter='9399d5399ec893b294220045186ca88d0ec2b1b4';harbor='96c86af3bc6d7e92f21fc771d21273be4714c8e9';source='8d3ed32f37af9ceb8b5778b92a0088384ed057d4'
        cases=[{'id': '1549', 'image': 'swebench/sweb.eval.x86_64.googlechrome_1776_lighthouse-1549@sha256:3612d5a8a0a4c78f24fa22b672619f18565cac40cdc4fdb0e50dfdb5e7ce5347', 'inputs': {'Dockerfile': '96565377ae322cf68419ebb17e813e08e49bfaacd1bb09bdb20780909df675ff', 'eval.sh': 'e0e6b83ededb55e546a4e17b0904b9a7da47bdc13c89fc6895519e9bb3b5632f', 'gold.patch': '5df9b0e82561b0080c5981ad8c0d13bf7392467e27a00671a97bd10a44a4f305', 'problem_assets/0-27e874c6-8f15-11e6-9e6c-1a9407a64d14.png': '08ce0dd8939e619fe96360eb6a8adc368acbd70217096ddf5e97df16b738a0c7', 'problem_statement.md': 'f1c3dc4f250cff4fe725b09b08bf5c222c8e7652e5c6a5132c68007d7fec9281', 'task.yaml': '78645fb50a598cf61a751aa7f4af010adc4c0fb9199e7222472676d4fb0df057', 'test.patch': '4c92b5224bc9c3abfb258022ee4bb00e394d9ab5b51d27772942a820ed1eb8a5', 'tests.json': '7b8155f54c12e091a3e97d841b25308b6fdb5b7fc4ca398c2954622ff0a742da'}}]
        summary={'adapter_commit':adapter,'harbor_commit':harbor,'task_source_commit':source,'model_calls':0,'scope':'Lighthouse 1549 dataset #262 rebuilt starter oracle/nop only; no instrumentation in generated task; no model parity','attempts':[]}
        stage='setup'
        def execute(argv,timeout=120,cwd=None):
            with (private/'setup.log').open('ab') as f:p=subprocess.run(argv,cwd=cwd,stdout=f,stderr=subprocess.STDOUT,timeout=timeout)
            if p.returncode:raise RuntimeError('command_nonzero')
        def manifest_evidence(folder):
            source='/tmp/harbor-submission/model.patch'
            expected='artifacts/tmp/harbor-submission/model.patch'
            manifest=folder/'artifacts/manifest.json'
            if manifest.is_symlink() or not manifest.is_file():return {'manifest':'missing_or_invalid'}
            try:
                if manifest.stat().st_size>1048576:return {'manifest':'oversize'}
                rows=json.loads(manifest.read_bytes())
                if not isinstance(rows,list):return {'manifest':'invalid'}
                rows=[r for r in rows if isinstance(r,dict) and r.get('source')==source]
                if len(rows)!=1:return {'manifest':'valid','row':'missing' if not rows else 'duplicate'}
                r=rows[0]
                result={'manifest':'valid','row':'unique','status':r.get('status') if r.get('status') in ('ok','failed','empty','skipped') else 'other','type':r.get('type') if r.get('type') in ('file','directory') else 'other','expected_destination':r.get('destination')==expected}
                if not result['expected_destination']:return result
                p=folder/expected
                if not p.resolve().is_relative_to((folder/'artifacts').resolve()) or any(x.is_symlink() for x in (p,*p.parents) if x!=folder and x.is_relative_to(folder)):
                    result['file']='symlink_or_outside';return result
                if not p.is_file():result['file']='missing_or_not_regular';return result
                size=p.stat().st_size;result.update(file='regular',bytes=size)
                if size<=4194304:result['sha256']=hashlib.sha256(p.read_bytes()).hexdigest()
                return result
            except (ValueError,OSError,TypeError,RuntimeError):
                return {'manifest':'unreadable'}
        def error_category(info):
            text=json.dumps(info).lower()
            if any(x in text for x in ['pull access denied','failed to resolve source metadata','failed to resolve reference']):return 'image_resolution'
            if 'no space left on device' in text:return 'disk_exhausted'
            if 'timed out' in text or 'timeout' in text:return 'timeout'
            if 'docker compose' in text and 'build' in text:return 'compose_build'
            if 'docker compose' in text and 'up' in text:return 'compose_start'
            return 'unclassified_infrastructure'
        def sha(p):return hashlib.sha256(P(p).read_bytes()).hexdigest()
        def ids(kind):
            cmd=['docker','ps','-aq'] if kind=='containers' else ['docker','image','ls','-q','--no-trunc']
            return set(subprocess.check_output(cmd,text=True).split())
        def cleanup_containers(before):
            for cid in ids('containers')-before:subprocess.run(['docker','rm','-f',cid],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=20)
        setup_ok=False
