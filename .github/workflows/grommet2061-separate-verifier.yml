                  dest=private/(label+'-'+name)
                  rc=subprocess.run(['docker','cp',cid+':'+path,str(dest)],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=15).returncode
                  result[name+'_sha256']=sha(dest) if rc==0 else None
                  if rc==0 and name=='integrity':
                      try:
                          data=json.loads(dest.read_text());result['integrity_top_level_count']=len(data.get('topLevelPatterns',[]));result['integrity_lock_entries_count']=len(data.get('lockfileEntries',{}))
                      except ValueError:result['integrity_parse_error']=True
              return result
          def sha(p):return hashlib.sha256(P(p).read_bytes()).hexdigest()
          def ids(kind):
              cmd=['docker','ps','-aq'] if kind=='containers' else ['docker','image','ls','-q','--no-trunc']
              return set(subprocess.check_output(cmd,text=True).split())
