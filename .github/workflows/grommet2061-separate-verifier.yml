          cases=[{'id': '2061', 'image': 'swebench/sweb.eval.x86_64.grommet_1776_grommet-2061@sha256:0fee0191d949f36b76327594ce4dd26200fa4fdbe1198838e62f0b8f909e299f', 'inputs': {'test.patch': 'a32a2d052bb7ed80c43a61d308b6619fa9c00da6e317261c31ac9cc24e0b6a2e', 'problem_statement.md': '70018808a6a7c537ebe63e5d328ccd3e3f1cb77cebe9b9dc330fdbc925b86916', 'eval.sh': '740ca83b10f1f138ab71041cdcda5c66f5a4e32c1913868af38e42440469b80e', 'tests.json': '074592f772eba264af0360a7e295dd5202a3b5bfd6ca8c0529a0d7c334e81bac', 'Dockerfile': '113c7af5c585b9ba4ea9bf3f397ecbbd2c40ee2269df247d6f6d82daf4302470', 'gold.patch': '01d722cb72d3fbc9437611694f3a6b52a941d07cf1e308b07c3e8398ac72f10d', 'task.yaml': '3bcc0a2032012dac7d08c03977fa84ce4856aa85374929487c4626acfa94bd79', 'problem_assets/1-38843203-e689b1b0-41bb-11e8-87ca-5b9c727300e8.jpg': '15a2c34122b04725a528b15f32868ee094aa267b3ef122331afff36388b44f88', 'problem_assets/0-38843188-d0a0325c-41bb-11e8-8357-c686034af89d.jpg': '12e3f10646b83283adf5ead750f2788172b823c11300ef8f97274a01386d0b43'}}]
          summary={'adapter_commit':adapter,'harbor_commit':harbor,'task_source_commit':source,'model_calls':0,'scope':'Grommet 2061 original oracle/nop only, not full480 or model parity','attempts':[]}
          migration='diff -ruN a/adapter.py b/adapter.py\n--- a/adapter.py\n+++ b/adapter.py\n@@ -248,6 +248,8 @@\n \n         src_folder = self.tasks_by_id[instance_id]\n         meta = self.task_metadata[instance_id]\n+        if not re.fullmatch(r"[0-9a-f]{40}", str(meta.get("base_commit", ""))):\n+            raise ValueError("Missing or invalid upstream base_commit")\n         task_name = self._task_name(instance_id)\n         task_dir = self.output_dir / task_name\n         for filename in ("gold.patch", "eval.sh", "tests.json", "problem_statement.md"):\n@@ -313,7 +315,7 @@\n             shutil.copy2(TEMPLATE_DIR / "tests" / "test.sh", tests_dir / "test.sh")\n             (tests_dir / "test.sh").chmod(0o755)\n \n-            for filename in ("grade.py", "upstream.py", "SWEBENCH_LICENSE"):\n+            for filename in ("grade.py", "upstream.py", "SWEBENCH_LICENSE", "apply_submission.py"):\n                 shutil.copy2(TEMPLATE_DIR / "tests" / filename, tests_dir / filename)\n             for key in ("log_parser", "eval_type", "version"):\n                 if key not in meta:\n@@ -384,6 +386,7 @@\n                 .replace("{repo}", meta.get("repo", "unknown"))\n                 .replace("{version}", str(meta.get("version", "latest")))\n                 .replace("{split}", str(meta.get("split", "test")))\n+                .replace("{base_commit}", meta["base_commit"])\n             )\n             (staging_dir / "task.toml").write_text(task_toml_content, encoding="utf-8")\n \ndiff -ruN a/task-template/task.toml b/task-template/task.toml\n--- a/task-template/task.toml\n+++ b/task-template/task.toml\n@@ -1,4 +1,5 @@\n schema_version = "1.0"\n+artifacts = ["/tmp/harbor-submission/model.patch"]\n \n [task]\n name = "swebench-multimodal/{task_name}"\n@@ -25,9 +26,14 @@\n split = "{split}"\n \n [verifier]\n+environment_mode = "separate"\n network_mode = "no-network"\n timeout_sec = 1800.0\n \n+[[verifier.collect]]\n+command = """bash -ec \'mkdir -p /tmp/harbor-submission; rm -f /tmp/harbor-submission/model.patch; cd /testbed; git -c safe.directory=/testbed add -N -- . ":!problem_assets"; git -c safe.directory=/testbed diff --binary {base_commit} -- . ":!problem_assets" > /tmp/harbor-submission/model.patch.tmp; mv /tmp/harbor-submission/model.patch.tmp /tmp/harbor-submission/model.patch\'"""\n+timeout_sec = 60.0\n+\n [agent]\n network_mode = "public"\n timeout_sec = 3600.0\ndiff -ruN a/task-template/tests/apply_submission.py b/task-template/tests/apply_submission.py\n--- a/task-template/tests/apply_submission.py\n+++ b/task-template/tests/apply_submission.py\n@@ -0,0 +1,23 @@\n+import hashlib\n+import json\n+import subprocess\n+from pathlib import Path\n+\n+\n+def apply_submission(repository, patch, metadata):\n+    base = metadata[\'base_commit\']\n+    head = subprocess.check_output([\'git\', \'-c\', \'safe.directory=\' + str(repository.resolve()), \'-C\', str(repository), \'rev-parse\', \'HEAD\'], text=True).strip()\n+    if head != base:\n+        raise ValueError(\'verifier base commit mismatch\')\n+    if not patch.is_file() or patch.is_symlink():\n+        raise ValueError(\'submission artifact missing or invalid\')\n+    data = patch.read_bytes()\n+    if data:\n+        subprocess.run([\'git\', \'-c\', \'safe.directory=\' + str(repository.resolve()), \'-C\', str(repository), \'apply\', \'--check\', str(patch.resolve())], check=True)\n+        subprocess.run([\'git\', \'-c\', \'safe.directory=\' + str(repository.resolve()), \'-C\', str(repository), \'apply\', str(patch.resolve())], check=True)\n+    return {\'submission_sha256\': hashlib.sha256(data).hexdigest(), \'submission_bytes\': len(data), \'base_commit\': base, \'empty_submission\': not data}\n+\n+\n+if __name__ == \'__main__\':\n+    evidence = apply_submission(Path(\'/testbed\'), Path(\'/tmp/harbor-submission/model.patch\'), json.loads(Path(\'/tests/task_metadata.json\').read_text()))\n+    Path(\'/logs/verifier/submission.json\').write_text(json.dumps(evidence))\ndiff -ruN a/task-template/tests/test.sh b/task-template/tests/test.sh\n--- a/task-template/tests/test.sh\n+++ b/task-template/tests/test.sh\n@@ -1,10 +1,10 @@\n #!/bin/bash\n-set -u\n+set -eu\n \n # Clean up any pre-existing or agent-forged reward files\n rm -f /logs/verifier/reward.json /logs/verifier/reward.txt /logs/verifier/metrics.json /logs/verifier/report.json\n mkdir -p /logs/verifier\n-echo 0 > /logs/verifier/reward.txt\n+python3 -I /tests/apply_submission.py\n \n cd /testbed\n set +e\n'
          migration_sha='38732e8c569a5d8f10eb9106f22c5339d914e9968b88c6210937d643072bcdc2'
          stage='setup'
