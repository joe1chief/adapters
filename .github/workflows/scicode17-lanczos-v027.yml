           row={'arm':label,'expected_reward':expected,'expected_solution_sha256':expected_sha}
           summary['attempts'].append(row);before=set();events=None
           if time.monotonic()-start>23*60:row['status']='not_run_budget';continue
           name='scicode5-'+label;folder=P('trials').resolve()/name
           try:
            before=containers()
            with (private/(name+'-events')).open('wb') as event_log:
             events=subprocess.Popen(['docker','events','--format','{{json .}}'],stdout=event_log,stderr=subprocess.DEVNULL)
             env=dict(os.environ,HARBOR_SCICODE_VERIFIED_TEST_DATA_PATH=str(hdf5))
             done=log_run([str(cli),'trials','start','--path',str(task),'--env','docker','--agent','oracle','--trial-name',name,'--trials-dir',str(folder.parent),'--no-force-build','--no-delete','--environment-kwarg','keep_containers=true'],name,650,env=env,check=False)
             row['cli_exit']=done.returncode
            row['native']=grading(folder,expected,expected_sha)
            row['containers']=verify_runtime(name,before,folder,hdf5)
           except Exception as e:row.update(status='runtime_or_evidence_error',error_type=type(e).__name__)
           finally:
            if events:
             events.terminate()
             try:events.wait(timeout=5)
             except subprocess.TimeoutExpired:events.kill();events.wait()
            f=private/(name+'-events')
            row['verifier_deny_all_events']=verifier_deny(f.read_text(errors='replace').splitlines(),name) if f.is_file() else 0
            c={x['role']:x for x in row.get('containers',[])}
            row['isolation_accepted']=len(c)==2 and len(row['containers'])==2 and c['agent']['container_id_prefix']!=c['verifier']['container_id_prefix'] and c['agent']['image_id']!=c['verifier']['image_id'] and all(not x['privileged'] and not x['added_caps'] and not x['host_network'] and x['solution_sha256']==expected_sha for x in c.values()) and c['agent']['input_hdf5_mount_count']==0 and c['agent']['tests_probe']=='missing' and c['verifier']['expected_hdf5_mount'] and c['verifier']['tests_probe']=='present' and c['verifier']['runtime_log_match']=={'reward.json':True,'metrics.json':True} and row['verifier_deny_all_events']>0
            row['accepted']=row.get('cli_exit')==0 and (row.get('native') or {}).get('accepted',False) and row['isolation_accepted']
            if before or events:
             for cid in containers()-before:
              subprocess.run(['docker','rm','-f',cid],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=20)
          summary['accepted']=len(summary['attempts'])==2 and all(x.get('accepted') for x in summary['attempts'])
          summary['seconds']=round(time.monotonic()-start,2)
          print('SANITIZED_SUMMARY '+json.dumps(summary))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('## SciCode-Verified #5 separate verifier\n```json\n'+json.dumps(summary,indent=2)+'\n```\n')
          if not summary['accepted']:raise SystemExit(1)
          PY
