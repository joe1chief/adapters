                            control_hash,_=copied_hash(cid,'/testbed/package.json',name+'-'+role+'-control')
                            probes={f:copied_hash(cid,'/tests/'+f,name+'-'+role+'-'+f) for f in ('test.sh','grade.py','tests.json','task_metadata.json')}
                            if role=='agent':
                                correct_test_visibility=control_hash is not None and all(missing for _,missing in probes.values())
                            else:
                                correct_test_visibility=all(digest==sha(task/'tests'/f) for f,(digest,_) in probes.items())
                            containers.append({'id_prefix':cid[:12],'role':role,'image':d['Image'],'privileged':hc['Privileged'],'cap_add':hc['CapAdd'] or [],'host_network':hc['NetworkMode']=='host','tests_mount':any(m['Destination']=='/tests' for m in d['Mounts']),'verifier_log_mount':any(m['Destination']=='/logs/verifier' for m in d['Mounts']),'expected_test_file_visibility':correct_test_visibility,'verifier_log_matches':log_match,'runtime_logs_match_export':len(log_match)==4 and all(log_match.values())})
                    attempt['containers']=containers
                    separation=len(containers)==2 and {c['role'] for c in containers}=={'agent','verifier'} and len({c['id_prefix'] for c in containers})==2 and len({c['image'] for c in containers})==1 and all(not c['privileged'] and not c['cap_add'] and not c['host_network'] and c['expected_test_file_visibility'] for c in containers) and all(not c['tests_mount'] for c in containers if c['role']=='agent')
