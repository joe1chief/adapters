                        if labels.get('com.docker.compose.service')=='main' and project.startswith(name):
                            hc=d['HostConfig']
                            role='verifier' if '__verifier__' in project else 'agent'
                            log_match={}
                            if role=='verifier':
                                trace=private/(name+'-verifier-phase.log')
