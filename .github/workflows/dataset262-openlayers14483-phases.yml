                                if cpstd.returncode==0 and std.is_file():
                                    attempt['launcher_stdout_sha256']=sha(std)
                                    host_stdout=folder/'verifier/test-stdout.txt'
                                    attempt['launcher_stdout_matches_export']=host_stdout.is_file() and sha(host_stdout)==attempt['launcher_stdout_sha256']
                                    with std.open(errors='replace') as stream:
