                assert task_config['artifacts']==['/tmp/harbor-submission/model.patch']
                case_summary['task_toml_sha256']=sha(task/'task.toml')
                stage='pull_fixed_image';execute(['docker','pull','--platform','linux/amd64',image],150)
                detail=json.loads(subprocess.check_output(['docker','image','inspect',image],text=True))[0];assert detail['Architecture']=='amd64' and detail['Os']=='linux';case_summary['image_id']=detail['Id']
                stage='image_base_target_check'
                before_base=ids('containers')
                try:
                    execute(['docker','run','--rm','--network','none','--entrypoint','/bin/sh',image,'-ec',
                             f'git -c safe.directory=/testbed -c core.fileMode=false -C /testbed diff --quiet {expected_base} -- src/ol/render/canvas.js src/ol/render/canvas/Immediate.js changelog/upgrade-notes.md test/browser/spec/ol/render/canvas/index.test.js'],45)
                    case_summary['base_target_paths_match']=True
                    head=subprocess.check_output(['docker','run','--rm','--network','none','--entrypoint','/bin/sh',image,'-ec',
