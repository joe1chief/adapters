                launch.write_text('#!/bin/bash\nset -eu\n\n# Clean up any pre-existing or agent-forged reward files\nrm -f /logs/verifier/reward.json /logs/verifier/reward.txt /logs/verifier/metrics.json /logs/verifier/report.json\nmkdir -p /logs/verifier\nstage_log() {\n    printf \'%s\\n\' "$1" >> /logs/verifier/diagnostic-phase.log || :\n}\nstage_log launcher_started\nstage_log submission_apply_started\npython3 -I /tests/apply_submission.py\nstage_log submission_applied\n\ncd /testbed\nset +e\nstage_log browser_evaluation_started\nbash /tests/eval.sh > /logs/verifier/test_output.log 2>&1\nstage_log "browser_evaluation_exit:$?"\nset -e\n\nstage_log scoring_started\npython3 /tests/grade.py /logs/verifier\nstage_log scoring_completed\n')
                after={f.relative_to(task).as_posix():sha(f) for f in task.rglob('*') if f.is_file()}
                assert after.keys()==run_hashes.keys() and [k for k in run_hashes if after[k]!=run_hashes[k]]==['tests/test.sh']
                case_summary['diagnostic_launcher_sha256']=after['tests/test.sh']
                case_ok=True
