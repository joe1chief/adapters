                                hv=exec_probe(['git','-c','safe.directory=/testbed','-C','/testbed','rev-parse','HEAD'])
                                value=hv.stdout.strip()
                                attempt['verifier_head']=value if hv.returncode==0 and re.fullmatch(r'[0-9a-f]{40}',value) else None
                                size=exec_probe(['stat','-c','%s','/tmp/harbor-submission/model.patch'])
                                val=size.stdout.strip()
