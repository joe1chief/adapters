name: Dataset 262 OpenLayers 14483 sandbox-on smoke
'on':
  push:
    branches:
    - diagnostic/dataset262-openlayers14483-sandbox-smoke-20261125
    paths:
    - .github/workflows/dataset262-openlayers14483-sandbox-smoke.yml
permissions:
  contents: read
jobs:
  openlayers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Check out exact adapter commit
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      with:
        repository: joe1chief/adapters
        ref: 9399d5399ec893b294220045186ca88d0ec2b1b4
        path: adapter-source
        persist-credentials: false
        fetch-depth: 1
        show-progress: false
    - name: Check out exact Harbor v0.27.0 commit
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      with:
        repository: harbor-framework/harbor
        ref: 96c86af3bc6d7e92f21fc771d21273be4714c8e9
        path: harbor-source
        persist-credentials: false
        fetch-depth: 1
        show-progress: false
    - name: OpenLayers 14483 reference and empty-submission checks
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport re,hashlib,json,os,pathlib,tomllib,platform,shutil,subprocess,time,urllib.request\nP=pathlib.Path\nstart=time.monotonic();private=P('private-run-data');private.mkdir()\nadapter='9399d5399ec893b294220045186ca88d0ec2b1b4';harbor='96c86af3bc6d7e92f21fc771d21273be4714c8e9';source='8d3ed32f37af9ceb8b5778b92a0088384ed057d4'\ncases=[{'id': '14483', 'image': 'swebench/sweb.eval.x86_64.openlayers_1776_openlayers-14483@sha256:5449d397d80505b6dbf387193cc60ae10617d5ec42cf0770caa22a55de9a5e28', 'inputs': {'Dockerfile': 'f9a048d694b220ebf36e606175c58dc9024904c6d48570cc6b9c8e4e78ed2ed1', 'eval.sh': '5b1a64887c606f4062b6c5165b5926f9e987b0557e829aa91c3e31f1b77f50c6', 'gold.patch': '913c768e30b5230f2ec511c284574749da9e00fbe5cc5fa4bd16ade3d174cf40', 'problem_assets/0-216621447-8f905a89-4cb3-4970-88d8-8d1d516e8153.png': '22511123985758c239b87203b245e2e9d0597baa880be6a0fe6aaa468f63ebb1', 'problem_assets/1-216622459-c59a58e7-f3f2-418c-97e8-c81b690aa26f.png': 'f976a200cc2c34702afe127c4a646f89e3543b3616eb703fdc04d14c9307a045', 'problem_assets/2-216623973-d556937d-aec9-41e2-b1c8-bc57932f85b6.png': 'df8b8ccc8e753a4aada38cbecac80fd2530cb9573f51067dd92dd534d2ba5969', 'problem_assets/codesandbox/index.html': '7379a3dea5954413187af49e48628d582a3bb3da0058994f113a321f581f3ceb', 'problem_assets/codesandbox/package.json': '04dd5bf7f9138bd829d7a7bff55397853959c0e21f1042f2e23de9714b4a8f6f', 'problem_assets/codesandbox/src/index.js': '1be8d3b3e9b046c1dc3422c263a1d21d8b561c2bf46904f2ac4fedf02ef555f3', 'problem_assets/codesandbox/src/opaqueTile.png': '02c987dbc37c396a6aff42d2f7872d0f5e6b9bf39c013e00531b6309c8adea92', 'problem_assets/codesandbox/src/styles.css': 'ce2f49474c399984f3847e80319e50f2f8f2251b8e9b977c130532a585f43ed7', 'problem_statement.md': '80fc6d1756aacd3d01a203983f5317701b9defcda58ca52d0bab36404f680c28', 'task.yaml': '6fb34df297c519a8e98d48110918e5ec27fbe027bf3a917a04e6ed5683ae1077', 'test.patch': 'bf1c16fff0644c2413d250a32b30348acdf2f1e08e2be5ba6af1a73cf4949327', 'tests.json': '6334746903df2c79c43f82aae8b0238513c6d8bffa6cea49675abc6b2d747e77'}}]\nsummary={'adapter_commit':adapter,'harbor_commit':harbor,'task_source_commit':source,'model_calls':0,'scope':'OpenLayers 14483 original oracle/nop only, not full480 or model parity','attempts':[]}\nstage='setup'\ndef diagnose(s):\n    clean=re.sub(r'\\x1b\\[[0-?]*[ -/]*[@-~]', '', s)\n    checks={\n      'begin_marker': r'>>>>> Start Test Output',\n      'end_marker': r'>>>>> End Test Output',\n      'browser_command_traced': r'(?m)^\\+\\s+su\\s+chromeuser\\s+-c\\s+.*npm run test-browser',\n      'npm_test_script_header': r'(?m)^> .* test-browser\\s*$',\n      'npm_not_found': r'(?im)(?:\\bnpm:\\s*(?:command )?not found|\\bnode:\\s*(?:command )?not found)',\n      'karma_not_found': r'(?im)\\bkarma:\\s*(?:command )?not found',\n      'dependency_missing': r'(?im)cannot find (?:module|package)|error while loading shared libraries',\n      'patch_applied_or_cleanly_checked': r'(?im)^Applied patch .* cleanly\\.',\n      'patch_error': r'(?im)^error: (?:patch failed|.*patch does not apply)',\n      'chrome_launch_error': r'(?im)cannot start chrome|failed to launch (?:the )?browser|no usable sandbox|no sandbox found',\n      'karma_server_started': r'(?im)karma v[^\\s]+ server started',\n      'chrome_connected': r'(?im)connected on socket',\n      'socket_error': r'(?im)\\b(?:ECONNREFUSED|EADDRINUSE|EACCES|ENETUNREACH)\\b|failed to connect to (?:the )?browser',\n      'suite_nonempty': r'Executed [1-9]\\d* of \\d+|TOTAL: [1-9]\\d* (?:SUCCESS|FAILED)',\n    }\n    return {k:bool(re.search(p,clean)) for k,p in checks.items()}\n\ndef chrome_errors(log):\n    patterns={\n        'launcher_reported_failure': r'cannot start chrome|failed to launch (?:the )?browser',\n        'sandbox_unavailable': r'no usable sandbox|no sandbox found|failed to move to new namespace|failed to unshare',\n        'shared_library_missing': r'error while loading shared libraries|cannot open shared object file',\n        'chrome_binary_missing': r'no binary for chrome|chrome[^\\n]{0,100}(?:no such file or directory|not found)',\n        'chrome_binary_permission': r'chrome[^\\n]{0,120}permission denied',\n        'shared_memory_or_disk': r'no space left on device|creating shared memory|failed to allocate shared memory',\n        'profile_problem': r'failed to create[^\\n]*(?:profile|user data)|processsingleton|profile appears to be in use',\n        'display_missing': r'missing x server or \\$DISPLAY|ozone_platform_x11[^\\n]*missing x server',\n        'chrome_late_or_cannot_capture': r'chrome[^\\n]{0,100}(?:have not captured|not captured|capture timeout)|disconnected[^\\n]{0,100}(?:because no message|ping timeout)',\n    }\n    logical=re.sub(r'\\x1b\\[[0-?]*[ -/]*[@-~]', '', log)\n    # Exclude git status/patch/checkout snippets before the official launcher.\n    anchored='>>>>> Start Test Output'\n    end='>>>>> End Test Output'\n    started=logical.count(anchored)==1 and logical.count(end)==1\n    body=logical.split(anchored,1)[1].split(end,1)[0] if started else ''\n    return {'bounded_browser_slice':started, **{k:bool(re.search(p,body,re.I)) for k,p in patterns.items()}}\n\ndef execute(argv,timeout=120,cwd=None):\n    with (private/'setup.log').open('ab') as f:p=subprocess.run(argv,cwd=cwd,stdout=f,stderr=subprocess.STDOUT,timeout=timeout)\n    if p.returncode:raise RuntimeError('command_nonzero')\ndef error_category(info):\n    text=json.dumps(info).lower()\n    if any(x in text for x in ['pull access denied','failed to resolve source metadata','failed to resolve reference']):return 'image_resolution'\n    if 'no space left on device' in text:return 'disk_exhausted'\n    if 'timed out' in text:return 'explicit_timed_out_message'\n    if 'docker compose' in text and 'build' in text:return 'compose_build'\n    if 'docker compose' in text and 'up' in text:return 'compose_start'\n    return 'unclassified_infrastructure'\ndef sha(p):return hashlib.sha256(P(p).read_bytes()).hexdigest()\ndef ids(kind):\n    cmd=['docker','ps','-aq'] if kind=='containers' else ['docker','image','ls','-q','--no-trunc']\n    return set(subprocess.check_output(cmd,text=True).split())\ndef cleanup_containers(before):\n    for cid in ids('containers')-before:subprocess.run(['docker','rm','-f',cid],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=20)\nsetup_ok=False\ntry:\n    assert platform.machine()=='x86_64' and shutil.disk_usage('.').free>9*1024**3\n    execute(['docker','compose','version'])\n    stage='verify_exact_checkout'\n    for repo_dir, expected in [('adapter-source',adapter),('harbor-source',harbor)]:\n        assert subprocess.check_output(['git','-C',repo_dir,'rev-parse','--verify','HEAD'],text=True).strip()==expected\n    assert subprocess.check_output(['git','-C','adapter-source','status','--porcelain=v1','--untracked-files=all'])==b''\n    summary['exact_checkouts_verified']=True\n    stage='locked_dependencies';execute(['python3','-m','venv','bootstrap']);execute(['bootstrap/bin/pip','install','uv==0.13.9'],120)\n    execute([str(P('bootstrap/bin/uv').resolve()),'sync','--frozen','--no-dev','--python','3.12'],420,'harbor-source')\n    py=str(P('harbor-source/.venv/bin/python').resolve());cli=str(P('harbor-source/.venv/bin/harbor').resolve());summary['harbor_lock_sha256']=sha('harbor-source/uv.lock');assert summary['harbor_lock_sha256']=='d411f1b7d259023d8ec2f920d7b8faedcf3b895e2320c2c0b5a606f3e1c2b960';assert subprocess.check_output(['git','hash-object','uv.lock'],cwd='harbor-source',text=True).strip()=='372259f90db33a133db683070411c914aad0057b';setup_ok=True\nexcept Exception as exc:summary['setup_error']={'stage':stage,'error_type':type(exc).__name__}\nfor case in cases:\n    n=case['id'];image=case['image'];case_ok=False;before_images=ids('images') if setup_ok else set()\n    case_summary={'task':n,'image':image,'source_sha256':case['inputs']};summary.setdefault('cases',[]).append(case_summary)\n    try:\n        if not setup_ok:raise RuntimeError('setup_incomplete')\n        if time.monotonic()-start>23*60:raise TimeoutError('budget')\n        if shutil.disk_usage('.').free<7*1024**3:raise OSError('insufficient_disk')\n        stage='public_inputs';td=P('task-source')/('openlayers__openlayers-'+n);td.mkdir(parents=True)\n        for name,digest in case['inputs'].items():\n            dest=td/name;dest.parent.mkdir(parents=True,exist_ok=True)\n            url='https://raw.githubusercontent.com/SWE-bench/swe-bench-multimodal-tasks/'+source+'/tasks/openlayers__openlayers-'+n+'/'+name\n            with urllib.request.urlopen(url,timeout=40) as r:dest.write_bytes(r.read())\n            assert sha(dest)==digest\n        stage='generate_exact_adapter';env=dict(os.environ);env['PYTHONPATH']=str(P('adapter-source/src/swebench-multimodal/src').resolve())\n        with (private/(n+'-generation.log')).open('wb') as f:subprocess.run([py,'-m','swebench_multimodal.main','--source-dir','task-source','--output-dir','generated','--task-ids','openlayers__openlayers-'+n],env=env,stdout=f,stderr=f,check=True,timeout=60)\n        task=P('generated/openlayers-openlayers-'+n).resolve();assert task.is_dir()\n        for generated,original in [('tests/eval.sh','eval.sh'),('solution/gold.patch','gold.patch'),('tests/tests.json','tests.json'),('tests/test.patch','test.patch')]:assert sha(task/generated)==case['inputs'][original]\n        exact={'environment/Dockerfile': 'f39a714a59e1e44fac69f8efee35e29952d8077c4d8d65a3994d02a523158151', 'environment/problem_assets/.gitkeep': 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855', 'environment/problem_assets/0-216621447-8f905a89-4cb3-4970-88d8-8d1d516e8153.png': '22511123985758c239b87203b245e2e9d0597baa880be6a0fe6aaa468f63ebb1', 'environment/problem_assets/1-216622459-c59a58e7-f3f2-418c-97e8-c81b690aa26f.png': 'f976a200cc2c34702afe127c4a646f89e3543b3616eb703fdc04d14c9307a045', 'environment/problem_assets/2-216623973-d556937d-aec9-41e2-b1c8-bc57932f85b6.png': 'df8b8ccc8e753a4aada38cbecac80fd2530cb9573f51067dd92dd534d2ba5969', 'environment/problem_assets/codesandbox/index.html': '7379a3dea5954413187af49e48628d582a3bb3da0058994f113a321f581f3ceb', 'environment/problem_assets/codesandbox/package.json': '04dd5bf7f9138bd829d7a7bff55397853959c0e21f1042f2e23de9714b4a8f6f', 'environment/problem_assets/codesandbox/src/index.js': '1be8d3b3e9b046c1dc3422c263a1d21d8b561c2bf46904f2ac4fedf02ef555f3', 'environment/problem_assets/codesandbox/src/opaqueTile.png': '02c987dbc37c396a6aff42d2f7872d0f5e6b9bf39c013e00531b6309c8adea92', 'environment/problem_assets/codesandbox/src/styles.css': 'ce2f49474c399984f3847e80319e50f2f8f2251b8e9b977c130532a585f43ed7', 'instruction.md': '3187d00ee51417e76927b063c0d8af34add2b72f375ad5254d1f9c4e7ba744dc', 'problem_assets/0-216621447-8f905a89-4cb3-4970-88d8-8d1d516e8153.png': '22511123985758c239b87203b245e2e9d0597baa880be6a0fe6aaa468f63ebb1', 'problem_assets/1-216622459-c59a58e7-f3f2-418c-97e8-c81b690aa26f.png': 'f976a200cc2c34702afe127c4a646f89e3543b3616eb703fdc04d14c9307a045', 'problem_assets/2-216623973-d556937d-aec9-41e2-b1c8-bc57932f85b6.png': 'df8b8ccc8e753a4aada38cbecac80fd2530cb9573f51067dd92dd534d2ba5969', 'problem_assets/codesandbox/index.html': '7379a3dea5954413187af49e48628d582a3bb3da0058994f113a321f581f3ceb', 'problem_assets/codesandbox/package.json': '04dd5bf7f9138bd829d7a7bff55397853959c0e21f1042f2e23de9714b4a8f6f', 'problem_assets/codesandbox/src/index.js': '1be8d3b3e9b046c1dc3422c263a1d21d8b561c2bf46904f2ac4fedf02ef555f3', 'problem_assets/codesandbox/src/opaqueTile.png': '02c987dbc37c396a6aff42d2f7872d0f5e6b9bf39c013e00531b6309c8adea92', 'problem_assets/codesandbox/src/styles.css': 'ce2f49474c399984f3847e80319e50f2f8f2251b8e9b977c130532a585f43ed7', 'solution/gold.patch': '913c768e30b5230f2ec511c284574749da9e00fbe5cc5fa4bd16ade3d174cf40', 'solution/solve.sh': 'f3ddb5b90bc837ba9cb552c7a6aa5dbea8fd48a62283a29c0692fbf2fc6a15ed', 'task.toml': '4253631414411982672e54c45f72933d2d7103e2f1dcb4e3e72b2c1d70e0feff', 'tests/SWEBENCH_LICENSE': '2bd2e08df7147f67a69b42c10efae09bd4bf119df397371036187d5dd1b02f57', 'tests/apply_submission.py': '2f9cacd5cf1f3596d5a63d278d8a9ae5be657a5ff22dbb0321523d6c6ef6af25', 'tests/eval.sh': '5b1a64887c606f4062b6c5165b5926f9e987b0557e829aa91c3e31f1b77f50c6', 'tests/grade.py': 'ccf08f2d1de503999722669141caf4af9e9e92d06f85260973446ee1d6ff5808', 'tests/task_metadata.json': 'c42b55ac64f12ea83f79507ffcb5b3d9e9affa97e2749b2fda605ba50cf10ef9', 'tests/test.patch': 'bf1c16fff0644c2413d250a32b30348acdf2f1e08e2be5ba6af1a73cf4949327', 'tests/test.sh': 'f08b1cf1182a684ad03335a3d06d7a3dfa379f7d25eeac35ac654219a5889b98', 'tests/tests.json': '6334746903df2c79c43f82aae8b0238513c6d8bffa6cea49675abc6b2d747e77', 'tests/upstream.py': 'b6e50637352b17bbbec02315c0b26bac3da49693a24e508871ec5c052033f5c5'}\n        actual={f.relative_to(task).as_posix():sha(f) for f in task.rglob('*') if f.is_file()}\n        assert actual==exact, 'generated tree differs from local pinned build'\n        case_summary['exact_generated_sha256']=actual\n        run_task=P('run-only')/task.name\n        shutil.copytree(task,run_task)\n        dockerfile=run_task/'environment/Dockerfile'\n        docker_text=dockerfile.read_text()\n        mutable='FROM '+image.split('@',1)[0]+':latest\\n'\n        assert docker_text.count(mutable)==1\n        dockerfile.write_text(docker_text.replace(mutable,'FROM '+image+'\\n',1))\n        run_hashes={f.relative_to(run_task).as_posix():sha(f) for f in run_task.rglob('*') if f.is_file()}\n        assert run_hashes.keys()==exact.keys() and [k for k in exact if run_hashes[k]!=exact[k]]==['environment/Dockerfile']\n        case_summary['runtime_only_dockerfile_sha256']=run_hashes['environment/Dockerfile']\n        task=run_task.resolve()\n        base_meta=json.loads((task/'tests/task_metadata.json').read_text())\n        expected_base=base_meta['base_commit']\n        assert base_meta['instance_id']=='openlayers__o